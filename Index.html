<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoFix Hub</title>
  <base target="_top">
  <!-- GENERIERT aus ui/shell.html, ui/app.css, ui/i18n.js, ui/app.js mit tools/build-index.js - nicht von Hand aendern -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <style>
/* Design-System aus Prompt Hub / Kaercher Translation Services. Quelle fuer Index.html (tools/build-index.js). */

  /* Basis: Design-System von Kärcher Translation Services (Styles.html) */
  :root {
    --primary-yellow: #FFED00;
    --primary-black: #000000;
    --bg-gray: #F5F5F5;
    --text-main: #333333;
    --text-sub: #666666;
    --border-light: #e0e0e0;
    --surface: #ffffff;
    --surface-2: #fafafa;
    --hover-row: #fffbe6;
    --red: #d93025;
    --green: #0d652d;
    --ins-bg: #e6f4ea; --ins-fg: #0d652d;
    --del-bg: #fce8e6; --del-fg: #a50e0e;
    --warn-bg: #fff3cd; --warn-fg: #856404;
    --info-bg: #e8f0fe; --info-fg: #174ea6;
  }
  html[data-theme="dark"] {
    --bg-gray: #1f1f1f; --text-main: #c9c9c9; --text-sub: #a6a6a6; --border-light: #414141;
    --surface: #1a1a1a; --surface-2: #1c1c1c; --hover-row: #2f2a12;
    --ins-bg: #1e3326; --ins-fg: #9fd5ae; --del-bg: #3a1d1d; --del-fg: #f2a3a3;
    --warn-bg: #3a3212; --warn-fg: #ecd98f; --info-bg: #1b2638; --info-fg: #a8c7fa;
  }
  * { box-sizing: border-box; }
  /* Icons: feste Breite, damit der Ligatur-Text nie Layout zerschiesst, falls die Schrift nicht laedt */
  .material-icons-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1; overflow: hidden; white-space: nowrap; flex-shrink: 0; font-size: 24px; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background: var(--surface); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
  .container { width: 100%; padding: 15px 25px 40px; flex: 1; }
  @media (max-width: 900px) { .container { padding: 10px 16px 30px; } }

  /* Kopfzeile */
  .top-bar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 10px 25px 0; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; background: var(--primary-yellow); color: #000; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .brand-title { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px; color: var(--text-main); }
  .brand-sub { font-size: 12px; color: var(--text-sub); }
  .top-actions { display: flex; align-items: center; gap: 6px; }
  .user-chip { font-size: 12px; color: var(--text-sub); margin-right: 8px; }
  .lang-btn { background: #f0f0f0; border: none; padding: 4px 12px; cursor: pointer; font-weight: 700; color: #666; font-size: 12px; border-radius: 2px; }
  .lang-btn.active { background: var(--primary-black); color: var(--primary-yellow); }
  html[data-theme="dark"] .lang-btn { background: #222; color: #a6a6a6; }
  html[data-theme="dark"] .lang-btn.active { background: #000; color: var(--primary-yellow); }
  .icon-btn { background: none; border: 1px solid var(--border-light); color: var(--text-sub); height: 28px; width: 32px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { color: var(--text-main); border-color: #999; }
  .icon-btn .material-icons-outlined { font-size: 18px; }

  .tab-nav { display: flex; justify-content: center; border-bottom: 2px solid #eee; margin: 10px 0 20px; width: 100%; overflow-x: auto; }
  html[data-theme="dark"] .tab-nav { border-bottom-color: #3b3b3b; }
  .tab-btn { padding: 12px 30px; background: none; border: none; font-size: 15px; font-weight: 700; color: var(--text-sub); cursor: pointer; text-transform: uppercase; border-bottom: 4px solid transparent; transition: all .2s; margin: 0 5px; white-space: nowrap; position: relative; }
  .tab-btn.active { color: var(--primary-black); border-bottom-color: var(--primary-yellow); }
  html[data-theme="dark"] .tab-btn.active { color: #f0f0f0; }
  .tab-btn:hover { background: var(--surface-2); color: var(--text-main); }
  #tabbtn-admin { color: var(--red); }
  #tabbtn-admin.active { border-bottom-color: var(--red); }
  .tab-count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; background: var(--red); color: #fff; border-radius: 9px; font-size: 11px; line-height: 18px; }
  .tab-content { display: none; animation: fadeIn .3s ease-in-out; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @media (max-width: 900px) { .tab-nav { justify-content: flex-start; } .tab-btn { padding: 12px 15px; font-size: 14px; } }

  /* Karten */
  .card { background: var(--surface); border: 1px solid var(--border-light); border-top: 5px solid var(--text-sub); padding: 22px 25px; box-shadow: 0 4px 15px rgba(0,0,0,.05); margin-bottom: 22px; }
  .card.yellow { border-top-color: var(--primary-yellow); }
  .card.red { border-top-color: var(--red); }
  .card.black { border-top-color: var(--primary-black); }
  html[data-theme="dark"] .card.black { border-top-color: #777; }
  .section-title { font-size: 16px; font-weight: 800; margin: 0 0 16px; text-transform: uppercase; border-bottom: 2px solid #eee; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  html[data-theme="dark"] .section-title { border-bottom-color: #3b3b3b; }
  .section-title .material-icons-outlined { font-size: 20px; }
  .hint { font-size: 13px; color: var(--text-sub); line-height: 1.5; margin: -6px 0 12px; }
  .muted { color: var(--text-sub); font-size: 12px; }

  .space-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px; }
  .space-tile { background: var(--surface); border: 1px solid var(--border-light); border-top: 6px solid var(--primary-yellow); padding: 20px; cursor: pointer; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; gap: 10px; min-height: 180px; text-align: left; font: inherit; color: inherit; }
  .space-tile:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,.1); background: var(--surface-2); }
  .space-tile h3 { margin: 0; font-size: 17px; font-weight: 800; text-transform: uppercase; }
  .space-tile p { margin: 0; font-size: 13px; color: var(--text-sub); line-height: 1.5; flex: 1; }
  .space-tile.request { border: 2px dashed #bbb; border-top: 6px dashed #bbb; align-items: center; justify-content: center; text-align: center; color: var(--text-sub); }
  .space-tile.request .material-icons-outlined { font-size: 44px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }

  .status-badge { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 10px; font-weight: 700; text-transform: uppercase; text-align: center; letter-spacing: .5px; border: 1px solid transparent; white-space: nowrap; }
  .b-gray { background: #F5F5F5; color: #555; border-color: #E0E0E0; }
  .b-yellow { background: #FFFCDB; color: #5D4037; border-color: #FFED00; }
  .b-green { background: #F1F8E9; color: #33691E; border-color: #C5E1A5; }
  .b-red { background: #FFEBEE; color: #C62828; border-color: #FFCDD2; }
  .b-blue { background: #e8f0fe; color: #174ea6; border-color: #c6dafc; }
  html[data-theme="dark"] .b-gray { background: #1f1f1f; color: #b2b2b2; border-color: #414141; }
  html[data-theme="dark"] .b-yellow { background: #333113; color: #e8d98a; border-color: #6b6420; }
  html[data-theme="dark"] .b-green { background: #22291a; color: #c0e8b0; border-color: #4f5e3e; }
  html[data-theme="dark"] .b-red { background: #2d1115; color: #e78888; border-color: #57252a; }
  html[data-theme="dark"] .b-blue { background: #1b2638; color: #a8c7fa; border-color: #2d4063; }

  /* Formulare */
  label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .form-row { margin-bottom: 15px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
  input, select, textarea { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 0; background: var(--surface); color: var(--text-main); font-family: inherit; transition: border-color .2s; }
  html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { border-color: #4a4a4a; }
  input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; padding: 0; accent-color: var(--primary-black); }
  html[data-theme="dark"] input[type="checkbox"] { accent-color: var(--primary-yellow); }
  input:focus, select:focus, textarea:focus { border-color: var(--primary-black); outline: none; background: var(--surface-2); }
  html[data-theme="dark"] input:focus, html[data-theme="dark"] select:focus, html[data-theme="dark"] textarea:focus { border-color: var(--primary-yellow); }
  textarea { resize: vertical; line-height: 1.5; }
  textarea.mono, .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
  select { height: 42px; }
  input:disabled, textarea:disabled, select:disabled { opacity: .6; cursor: not-allowed; }
  .check-row { display: flex; gap: 8px; align-items: center; font-weight: 400; font-size: 14px; margin: 0; }

  .btn { border: none; padding: 0 22px; font-size: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; height: 42px; border-radius: 0; letter-spacing: .5px; text-decoration: none; white-space: nowrap; gap: 8px; }
  .btn .material-icons-outlined { font-size: 19px; }
  .btn-primary { background: var(--primary-yellow); color: #000; }
  .btn-primary:hover { background: #e6d500; }
  .btn-secondary { background: var(--bg-gray); color: var(--text-main); border: 1px solid #ccc; }
  html[data-theme="dark"] .btn-secondary { border-color: #4a4a4a; }
  .btn-secondary:hover { background: #e0e0e0; border-color: #999; }
  html[data-theme="dark"] .btn-secondary:hover { background: #2b2b2b; }
  .btn-black { background: #000; color: var(--primary-yellow); }
  .btn-black:hover { opacity: .9; }
  .btn-red { background: #ffcdd2; color: #b71c1c; }
  html[data-theme="dark"] .btn-red { background: #391619; color: #ee9191; }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 12px; }
  .btn-link { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Tabellen */
  .table-wrap { overflow-x: auto; }
  .history-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid #ddd; }
  html[data-theme="dark"] .history-table { border-color: #424242; }
  .history-table th { background: #f2f2f2; text-align: left; padding: 10px 12px; font-weight: 800; border-bottom: 2px solid #ddd; text-transform: uppercase; font-size: 11px; color: #444; }
  html[data-theme="dark"] .history-table th { background: #212121; border-bottom-color: #424242; color: #bebebe; }
  .history-table td { padding: 8px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
  html[data-theme="dark"] .history-table td { border-bottom-color: #3b3b3b; }
  .history-table tr:hover td { background: var(--hover-row); }
  .history-table td input, .history-table td select, .history-table td textarea { padding: 6px 8px; font-size: 13px; height: auto; }

  /* Editor-Layout (split-wrapper aus Translation Services) */
  .editor-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .crumbs { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
  .crumbs a { color: var(--text-sub); cursor: pointer; text-decoration: underline; }
  .editor-title { font-size: 22px; font-weight: 900; text-transform: uppercase; margin: 0 0 6px; }
  .save-state { font-size: 12px; color: var(--text-sub); min-height: 16px; }
  .split-wrapper { display: flex; align-items: flex-start; gap: 26px; }
  .split-main { flex: 1; min-width: 0; }
  .split-sidebar { width: 480px; flex-shrink: 0; background: var(--surface); border: 1px solid #ddd; border-top: 5px solid var(--primary-yellow); box-shadow: 0 4px 15px rgba(0,0,0,.05); position: sticky; top: 8px; max-height: calc(100vh - 20px); overflow-y: auto; }
  html[data-theme="dark"] .split-sidebar { border-color: #424242; border-top-color: var(--primary-yellow); }
  @media (max-width: 600px) { .card { padding: 16px; } .split-sidebar .side-pane { padding: 12px; } .compare { grid-template-columns: 1fr; } .editor-head .btn-row .btn { flex: 1; } }
  @media (max-width: 1200px) { .split-wrapper { flex-direction: column; align-items: stretch; } .split-sidebar { width: 100%; position: static; max-height: none; } }
  .side-tabs { display: flex; border-bottom: 2px solid #eee; position: sticky; top: 0; background: var(--surface); z-index: 2; overflow-x: auto; }
  html[data-theme="dark"] .side-tabs { border-bottom-color: #3b3b3b; }
  .side-tab { flex: 1; padding: 12px 8px; background: none; border: none; border-bottom: 3px solid transparent; font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--text-sub); cursor: pointer; white-space: nowrap; }
  .side-tab.active { color: var(--text-main); border-bottom-color: var(--primary-yellow); }
  .side-pane { display: none; padding: 18px; }
  .side-pane.active { display: block; }

  .section-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .section-chip { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 5px 9px; border: 1px solid var(--border-light); background: var(--surface); color: var(--text-sub); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .section-chip:hover { border-color: #999; color: var(--text-main); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c5e1a5; display: inline-block; }
  .dot.warn { background: #f9ab00; }
  .dot.err { background: var(--red); }
  .dot.none { background: #ddd; }

  .sec-card { border-left: 4px solid var(--primary-yellow); }
  .sec-card.locked { border-left-color: #999; }
  .sec-card.has-error { border-left-color: var(--red); }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .sec-head h4 { flex-wrap: wrap; min-width: 0; }
  .sec-head h4 { margin: 0; font-size: 14px; font-weight: 800; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
  .sec-tag { font-size: 10px; font-weight: 700; padding: 2px 6px; background: var(--bg-gray); color: var(--text-sub); text-transform: uppercase; }
  .sec-tag .material-icons-outlined { font-size: 13px; vertical-align: -2px; }
  .lock-box { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 12px; font-size: 12px; min-width: 260px; }
  .lock-box .check-row { font-size: 12px; }
  .sec-tag.req { background: #000; color: var(--primary-yellow); }
  .sec-issues { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; }
  .sec-issues li { padding: 3px 0; display: flex; gap: 6px; }
  .sec-issues li.error { color: var(--red); }
  .sec-issues li.warning { color: #b06000; }
  html[data-theme="dark"] .sec-issues li.warning { color: #f9c46b; }

  .gl-group { border: 1px solid var(--border-light); margin-bottom: 14px; }
  .gl-group-head { display: flex; gap: 10px; align-items: center; padding: 10px; background: var(--bg-gray); flex-wrap: wrap; }
  .gl-group-head select { width: auto; min-width: min(280px, 100%); max-width: 100%; height: 34px; padding: 4px 8px; font-size: 13px; }
  .gl-group-head input { flex: 1; min-width: 160px; padding: 6px 8px; font-size: 13px; }
  .gl-table td { padding: 4px 6px; }
  .gl-table td:last-child { width: 36px; text-align: center; }
  .row-del { background: none; border: none; color: #aaa; cursor: pointer; }
  .row-del:hover { color: var(--red); }

  /* Pruefung, Test, Diff */
  .issue { display: flex; gap: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.45; border-left: 4px solid; background: var(--surface-2); }
  .issue.error { border-left-color: var(--red); }
  .issue.warning { border-left-color: #f9ab00; }
  .issue.info { border-left-color: #1a73e8; }
  .issue.ok { border-left-color: #34a853; }
  .issue .material-icons-outlined { font-size: 18px; }
  .meter { height: 8px; background: var(--bg-gray); position: relative; margin: 6px 0 2px; }
  .meter > span { position: absolute; left: 0; top: 0; bottom: 0; background: #34a853; }
  .meter.warn > span { background: #f9ab00; }
  .meter.err > span { background: var(--red); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
  .kv b { font-weight: 700; }
  .notice { padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .notice .material-icons-outlined { font-size: 20px; }
  .notice.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .notice.info { background: var(--info-bg); color: var(--info-fg); }
  .notice.err { background: var(--del-bg); color: var(--del-fg); }
  .notice.ok { background: var(--ins-bg); color: var(--ins-fg); }

  .seg { border: 1px solid var(--border-light); padding: 12px; margin-bottom: 10px; background: var(--surface); }
  .seg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--text-sub); }
  .seg textarea { font-size: 13px; padding: 8px; margin-bottom: 6px; }
  .seg .mini-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-sub); margin: 4px 0 3px; }
  .result-text { font-size: 14px; line-height: 1.6; padding: 10px; background: var(--surface-2); border: 1px solid var(--border-light); white-space: pre-wrap; word-break: break-word; }
  .diff-ins { background: var(--ins-bg); color: var(--ins-fg); text-decoration: none; }
  .diff-del { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; }
  .checks { list-style: none; padding: 0; margin: 8px 0 0; font-size: 12px; }
  .checks li { display: flex; gap: 6px; padding: 2px 0; }
  .checks .ok { color: var(--green); }
  html[data-theme="dark"] .checks .ok { color: #9fd5ae; }
  .checks .fail { color: var(--red); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compare h5 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; }
  pre.prompt-view { white-space: pre-wrap; word-break: break-word; font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--border-light); padding: 12px; max-height: 70vh; overflow: auto; margin: 0; }
  .line-ins { background: var(--ins-bg); color: var(--ins-fg); display: block; }
  .line-del { background: var(--del-bg); color: var(--del-fg); display: block; text-decoration: line-through; }
  .wrapper-part { color: var(--text-sub); }
  .seg-toggle { display: inline-flex; border: 1px solid var(--border-light); }
  .seg-toggle button { background: var(--surface); border: none; padding: 6px 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-sub); cursor: pointer; }
  .seg-toggle button.active { background: #000; color: var(--primary-yellow); }

  .faq-item { background: var(--surface); border: 1px solid var(--border-light); border-left: 4px solid var(--primary-yellow); margin-bottom: 10px; }
  .faq-item summary { list-style: none; cursor: pointer; padding: 14px 18px; font-weight: 700; font-size: 14px; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item .faq-answer { padding: 0 18px 16px; font-size: 13px; line-height: 1.6; color: var(--text-sub); }

  .admin-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 22px; align-items: start; }
  .admin-grid > .card { grid-column: span 3; min-width: 0; margin: 0; }
  .admin-grid > .card.wide { grid-column: 1 / -1; }
  @media (max-width: 1300px) { .admin-grid > .card { grid-column: 1 / -1; } }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); padding: 16px; }
  .overlay.show { display: flex; }
  .dialog { background: var(--surface); width: 640px; max-width: 100%; max-height: 88vh; overflow-y: auto; border-top: 8px solid var(--primary-yellow); box-shadow: 0 20px 50px rgba(0,0,0,.2); padding: 24px 28px; }
  .dialog h3 { margin: 0 0 14px; font-size: 18px; font-weight: 800; text-transform: uppercase; }
  .denied { max-width: 760px; margin: 30px auto; text-align: center; }
  .denied .material-icons-outlined.big { font-size: 70px; color: var(--red); }
  .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-yellow); border-radius: 50%; width: 46px; height: 46px; animation: spin 1s linear infinite; margin: 40px auto; }
  html[data-theme="dark"] .loader { border-color: #383838; border-top-color: var(--primary-yellow); }

  approve: ['Freigeben', 'Approve'], reject: ['Ablehnen', 'Reject'], pending: ['Offen', 'Pending'], approved: ['Freigegeben', 'Approved'], rejected: ['Abgelehnt', 'Rejected'],

  <script>
/* global t, applyI18n, LANG:writable, google */
// AutoFix Hub - Oberflaeche. Ruft ausschliesslich die api*-Funktionen aus HubApi.gs auf.
var App = (function () {
  'use strict';

  var S = {
    boot: null, tab: 'dashboard',
    dash: null, queue: null, logs: null, logFilter: { q: '', status: 'all', type: 'all' }, openDiffs: {},
    lr: { running: false, logs: [], seen: 0, stats: { projects: 0, projTotal: 0, jobs: 0, jobTotal: 0, segs: 0, errors: 0 }, state: '', text: '', error: '' },
    analysis: { sub: 'mqm', options: null, result: {}, busy: false, filters: {} },
    prompts: null, admin: null
  };
  var timers = {};
  var RANK = { viewer: 1, operator: 2, admin: 3 };

  // ------------------------------------------------------------------
  // Grundlagen
  // ------------------------------------------------------------------
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve) {
      google.script.run
        .withSuccessHandler(function (res) { resolve(res || { success: false, error: 'Leere Antwort' }); })
        .withFailureHandler(function (err) { resolve({ success: false, error: (err && err.message) || String(err) }); })[name].apply(null, args);
    });
  }
  function h(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function icon(n) { return '<span class="material-icons-outlined">' + n + '</span>'; }
  function badge(cls, text) { return '<span class="status-badge ' + cls + '">' + h(text) + '</span>'; }
  function can(role) { return !!S.boot && RANK[S.boot.role] >= RANK[role]; }
  function toast(msg, isErr) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(timers.toast);
    timers.toast = setTimeout(function () { el.className = 'toast'; }, isErr ? 6000 : 3000);
  }
  function fmtDate(iso, dateOnly) {
    if (!iso) return '–';
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    var loc = LANG === 'en' ? 'en-GB' : 'de-DE';
    return dateOnly ? d.toLocaleDateString(loc) : d.toLocaleString(loc, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function ts() { return new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  function loader() { return '<div class="loader"></div>'; }
  function errBox(msg) { return '<div class="notice err">' + icon('error') + '<div>' + h(msg) + '</div></div>'; }
  function empty(msg, ic) { return '<div class="empty">' + (ic ? '<div>' + icon(ic) + '</div>' : '') + h(msg) + '</div>'; }
  function typeBadge(type) { return type ? badge('b-blue', type) : badge('b-gray', '–'); }

  function dialog(html) { $('dialogBody').innerHTML = html; $('dialog').classList.add('show'); }
  function closeDialog() { $('dialog').classList.remove('show'); }
  function confirmDialog(title, text, okLabel) {
    return new Promise(function (resolve) {
      dialog('<h3>' + h(title) + '</h3><p style="line-height:1.6">' + text + '</p><div class="btn-row" style="justify-content:flex-end;margin-top:20px">' +
        '<button class="btn btn-secondary" id="dlgNo">' + t('cancel') + '</button><button class="btn btn-primary" id="dlgYes">' + h(okLabel || t('confirm')) + '</button></div>');
      $('dlgNo').onclick = function () { closeDialog(); resolve(false); };
      $('dlgYes').onclick = function () { closeDialog(); resolve(true); };
    });
  }

  // Wortweiser Diff fuer Original -> Korrektur (wie im Prompt Hub)
  function diffWords(a, b) {
    var A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/);
    if (A.length * B.length > 250000) return [{ op: 'del', text: a }, { op: 'ins', text: b }];
    var n = A.length, m = B.length, dp = [], i, j;
    for (i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    var out = [];
    function push(op, tx) { if (out.length && out[out.length - 1].op === op) out[out.length - 1].text += tx; else out.push({ op: op, text: tx }); }
    i = 0; j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { push('eq', A[i]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { push('del', A[i]); i++; } else { push('ins', B[j]); j++; }
    }
    while (i < n) push('del', A[i++]);
    while (j < m) push('ins', B[j++]);
    return out;
  }
  function diffHtml(a, b) {
    return diffWords(a, b).map(function (p) { return p.op === 'eq' ? h(p.text) : '<span class="diff-' + p.op + '">' + h(p.text) + '</span>'; }).join('');
  }

  // ------------------------------------------------------------------
  // Start
  // ------------------------------------------------------------------
  function init() {
    updateThemeIcon();
    call('apiHubBootstrap').then(function (res) {
      $('boot').classList.add('hidden');
      if (!res.success) { $('boot').classList.remove('hidden'); $('boot').innerHTML = errBox(res.error); return; }
      S.boot = res;
      LANG = res.lang || 'de';
      markLang(); applyI18n();
      $('userChip').textContent = (res.email || '') + (res.role ? ' · ' + t('role_' + res.role) : '');
      if (!res.authorized) { renderDenied(); return; }
      $('tabNav').classList.remove('hidden');
      if (res.openMode) {
        var b = $('openModeBanner');
        b.innerHTML = icon('lock_open') + '<div><b>Zugriffsschutz ist noch nicht eingerichtet.</b> Aktuell darf jeder in der Domain alles. Lege unter Admin → Nutzer &amp; Rechte den ersten Admin fest.</div>';
        b.classList.remove('hidden');
      }
      if (can('admin')) {
        $('tabbtn-admin').classList.remove('hidden');
        if (res.pendingRequests) { $('adminCount').textContent = res.pendingRequests; $('adminCount').classList.remove('hidden'); }
      }
      var hash = (location.hash || '').replace('#', '');
      showTab(['dashboard', 'liverun', 'queue', 'runlog', 'analysis', 'prompts', 'admin', 'help'].indexOf(hash) !== -1 ? hash : 'dashboard');
    });
  }
  function setLang(l) { LANG = l; markLang(); applyI18n(); rerender(); call('apiHubSetLang', l); }
  function markLang() {
    document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === LANG); });
    document.documentElement.lang = LANG;
  }
  function toggleTheme() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark');
    try { localStorage.setItem('afh_theme', dark ? 'light' : 'dark'); } catch (e) {}
    updateThemeIcon();
  }
  function updateThemeIcon() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var b = $('themeBtn'); if (b) b.innerHTML = icon(dark ? 'light_mode' : 'dark_mode');
  }
  function showTab(tab) {
    if (tab === 'admin' && !can('admin')) tab = 'dashboard';
    S.tab = tab;
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
    document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.toggle('active', c.id === 'tab-' + tab); });
    rerender(true);
  }
  function rerender(load) {
    if (!S.boot || !S.boot.authorized) { if (S.boot) renderDenied(); return; }
    ({ dashboard: renderDashboard, liverun: renderLiveRun, queue: renderQueue, runlog: renderRunLog, analysis: renderAnalysis, prompts: renderPrompts, admin: renderAdmin, help: renderHelp })[S.tab](load);
  }

  // ------------------------------------------------------------------
  // DASHBOARD
  // ------------------------------------------------------------------
  function renderDashboard(load) {
    if (load || !S.dash) {
      if (!S.dash) $('tab-dashboard').innerHTML = loader();
      call('apiHubDashboard').then(function (res) { S.dash = res; if (S.tab === 'dashboard') drawDashboard(); });
      if (S.dash) drawDashboard();
      return;
    }
    drawDashboard();
  }
  function drawDashboard() {
    var d = S.dash;
    if (!d.success) { $('tab-dashboard').innerHTML = errBox(d.error); return; }
    var w = d.week;
    var html = '<div class="kpi-grid">' +
      '<div class="kpi ' + (d.poller.active ? 'green' : 'gray') + '"><div class="kpi-val">' + (d.poller.active ? t('active') : t('inactive')) + '</div><div class="kpi-label">' + t('poller') + '</div>' +
      (can('operator') ? '<div class="btn-row" style="margin-top:10px">' + [5, 10, 30].map(function (m) { return '<button class="btn btn-sm btn-secondary" onclick="App.pollerStart(' + m + ')">' + m + ' Min</button>'; }).join('') +
        (d.poller.active ? '<button class="btn btn-sm btn-red" onclick="App.pollerStop()">' + t('stop') + '</button>' : '') + '</div>' : '') + '</div>' +
      '<div class="kpi ' + (d.running ? '' : 'gray') + '"><div class="kpi-val">' + (d.running ? t('running') : t('ready')) + '</div><div class="kpi-label">' + t('run_state') + '</div><div class="kpi-sub">Letzter Lauf: ' + h(fmtDate(d.lastRun)) + '</div></div>' +
      '<div class="kpi"><div class="kpi-val">' + w.jobs + '</div><div class="kpi-label">' + t('jobs_7d') + '</div><div class="kpi-sub">' + Object.keys(w.byLang).length + ' Sprachen · ' + Object.keys(w.byType).length + ' Typen</div></div>' +
      '<div class="kpi"><div class="kpi-val">' + w.changed.toLocaleString() + '</div><div class="kpi-label">' + t('changed_7d') + '</div><div class="kpi-sub">' + w.changeRate + ' % von ' + w.segments.toLocaleString() + '</div></div>' +
      '<div class="kpi ' + (w.failed ? 'red' : 'green') + '"><div class="kpi-val">' + w.failed + '</div><div class="kpi-label">' + t('errors_7d') + '</div></div>' +
      '</div>';
    html += '<div class="admin-grid"><div class="card black span4"><div class="section-title"><span>' + icon('history') + ' ' + t('recent_runs') + '</span><button class="btn btn-sm btn-secondary" onclick="App.showTab(\'runlog\')">' + t('tab_runlog') + '</button></div>' +
      (d.logError ? errBox(d.logError) : '') +
      (d.recent.length ? '<div class="table-wrap"><table class="history-table"><thead><tr><th>' + t('date') + '</th><th>' + t('project') + '</th><th>' + t('type') + '</th><th>' + t('language') + '</th><th>' + t('status') + '</th><th>' + t('segs_changed') + '</th></tr></thead><tbody>' +
        d.recent.map(function (l) {

        }).join('') + '</tbody></table></div>' : empty('Noch keine Läufe.', 'hourglass_empty')) + '</div>';

  function pollerStart(m) {

  // ------------------------------------------------------------------
  // LIVE-RUN
  // ------------------------------------------------------------------
  function renderLiveRun() {
    var L = S.lr, st = L.stats;
    var pct = function (a, b) { return b > 0 ? Math.round(a / b * 100) : 0; };
    var html = '<div class="kpi-grid">' +
      '<div class="kpi"><div class="kpi-val">' + (st.projTotal || '–') + '</div><div class="kpi-label">' + t('projects') + '</div><div class="progress"><span style="width:' + pct(st.projects, st.projTotal) + '%"></span></div></div>' +
      '<div class="kpi"><div class="kpi-val">' + (st.jobTotal ? st.jobs + '/' + st.jobTotal : '–') + '</div><div class="kpi-label">' + t('jobs') + '</div><div class="progress"><span style="width:' + pct(st.jobs, st.jobTotal) + '%"></span></div></div>' +
      '<div class="kpi"><div class="kpi-val">' + (st.segs || '–') + '</div><div class="kpi-label">' + t('segs_changed') + '</div></div>' +
      '<div class="kpi ' + (st.errors ? 'red' : 'gray') + '"><div class="kpi-val">' + (st.errors || '–') + '</div><div class="kpi-label">' + t('errors') + '</div></div></div>';
    html += '<div class="card black"><div class="section-title"><span class="run-state"><span class="run-dot ' + L.state + '"></span>' + h(L.text || t('ready')) + '</span><div class="btn-row">' +
      (can('operator') ? '<button class="btn btn-primary" id="lrRunBtn" onclick="App.runManual()"' + (L.running ? ' disabled' : '') + '>' + (L.running ? '<span class="spin-sm"></span>' : icon('bolt')) + t('run_now') + '</button>' : '') +
      '<button class="btn btn-secondary" onclick="App.lrClear()"' + (L.running ? ' disabled' : '') + '>' + icon('delete_sweep') + t('clear') + '</button></div></div>' +
      '<div class="console" id="lrConsole">' + consoleHtml() + '</div>' +
      (L.error ? '<div class="notice err" style="margin-top:14px">' + icon('error') + '<pre style="margin:0;white-space:pre-wrap">' + h(L.error) + '</pre></div>' : '') +
      (!can('operator') ? '<p class="hint" style="margin-top:12px">Zum Starten brauchst du die Rolle „Ausführen“. Du siehst hier den Fortschritt laufender Runs.</p>' : '') + '</div>';
    $('tab-liverun').innerHTML = html;
    var c = $('lrConsole'); c.scrollTop = c.scrollHeight;
  }
  function consoleHtml() {
    if (!S.lr.logs.length) return '<div><span class="t">--:--:--</span><span class="l INFO">INFO</span>Bereit. „' + t('run_now') + '“ startet einen Lauf über alle Projekte mit AutoFix-Flag.</div>';
    return S.lr.logs.map(function (e) {
      return '<div><span class="t">' + h(e.t) + '</span><span class="l ' + h(e.level) + '">' + h(e.level) + '</span>' + h(e.msg) + (e.sub ? ' <span class="sub">· ' + h(e.sub) + '</span>' : '') + '</div>';
    }).join('');
  }
  function lrLog(level, msg, sub) {
    S.lr.logs.push({ t: ts(), level: level, msg: msg, sub: sub || '' });
    if (S.tab === 'liverun') { var c = $('lrConsole'); if (c) { c.innerHTML = consoleHtml(); c.scrollTop = c.scrollHeight; } }
  }
  function lrClear() {
    S.lr = { running: false, logs: [], seen: 0, stats: { projects: 0, projTotal: 0, jobs: 0, jobTotal: 0, segs: 0, errors: 0 }, state: '', text: '', error: '' };
    renderLiveRun();
  }
  function runManual() {
    if (S.lr.running) return showTab('liverun');
    lrClear();
    S.lr.running = true; S.lr.state = 'active'; S.lr.text = t('running');
    showTab('liverun');
    lrLog('INFO', 'Starte AutoFix-Lauf …');
    call('apiHubClearRunStatus').then(function () {
      timers.poll = setInterval(function () {
        if (!S.lr.running) return clearInterval(timers.poll);
        call('apiHubRunStatus').then(function (r) {
          if (!r || !r.entries) return;
          var fresh = r.entries.slice(S.lr.seen);
          S.lr.seen = r.entries.length;
          fresh.forEach(function (e) { S.lr.logs.push({ t: e.t || ts(), level: e.level || 'INFO', msg: e.msg || '', sub: '' }); });
          if (fresh.length && S.tab === 'liverun') { var c = $('lrConsole'); if (c) { c.innerHTML = consoleHtml(); c.scrollTop = c.scrollHeight; } }
        });
      }, 2000);
    });
    call('apiHubRunNow').then(function (r) {
      clearInterval(timers.poll);
      var L = S.lr; L.running = false;
      if (!r.success) { lrLog('ERR', r.error); L.state = 'error'; L.text = 'Fehlgeschlagen'; L.error = r.error; renderIf('liverun'); return; }
      var projects = r.results || [];
      L.stats.projTotal = L.stats.projects = r.count || projects.length;
      if (!L.stats.projTotal) { lrLog('WARN', 'Keine Projekte mit AutoFix-Flag.'); L.state = 'done'; L.text = 'Fertig – nichts zu tun'; renderIf('liverun'); return; }
      var hasErr = false;
      projects.forEach(function (p) {
        if (!p.success) { lrLog('ERR', 'Projekt-Fehler: ' + (p.projectUid || '?'), p.error); L.stats.errors++; hasErr = true; return; }
        (p.results || []).forEach(function (job) {
          L.stats.jobTotal++; L.stats.jobs++;
          if (job.skipped) lrLog('WARN', 'Übersprungen: ' + (job.filename || job.jobUid), job.reason);
          else if (!job.success) { L.stats.errors++; hasErr = true; lrLog('ERR', 'Job-Fehler: ' + (job.filename || job.jobUid), job.targetLang); L.error = job.error || 'Unbekannter Fehler'; }
          else { L.stats.segs += job.segmentsChanged || 0; lrLog('OK', job.filename || job.jobUid, job.targetLang + (job.autoFixType ? ' [' + job.autoFixType + ']' : '') + ' | ' + (job.segmentsChanged || 0) + '/' + (job.segmentsTotal || 0) + ' Seg'); }
        });
      });
      L.state = hasErr ? 'error' : 'done';
      L.text = hasErr ? 'Beendet mit Fehlern' : 'Erfolgreich beendet';
      toast(hasErr ? 'Lauf beendet – mit Fehlern.' : 'AutoFix abgeschlossen.', hasErr);
      S.logs = null; S.dash = null;
      renderIf('liverun');
    });
  }
  function renderIf(tab) { if (S.tab === tab) rerender(); }

  function renderQueue(load) {

      '<button class="btn btn-sm btn-secondary" onclick="App.reloadQueue()">' + icon('refresh') + t('refresh') + '</button></div></div>' +
      '<p class="hint">Projekte in Phrase mit gesetztem AutoFix-Custom-Field und Jobs im Workflow-Schritt „PE Gemini“.</p>';

    else {

        r.projects.map(function (p) {

            (p.targetLangs || []).map(function (l) { return badge('b-gray', l); }).join(' ') + '</td><td><b>' + (p.jobs || []).length + '</b></td></tr>';
        }).join('') + '</tbody></table></div>';

  // ------------------------------------------------------------------
  // RUN LOG
  // ------------------------------------------------------------------
  function renderRunLog(load) {
    if (load || !S.logs) {
      if (!S.logs) $('tab-runlog').innerHTML = loader();
      call('apiHubRunLogs').then(function (r) { S.logs = r; renderIf('runlog'); });
      if (!S.logs) return;
    }
    var r = S.logs, F = S.logFilter;
    var html = '<div class="card black"><div class="section-title"><span>' + icon('history') + ' ' + t('tab_runlog') + '</span><div class="btn-row">' +
      '<button class="btn btn-sm btn-secondary" onclick="App.openSheet()">' + icon('table_view') + t('open_sheet') + '</button>' +
      '<button class="btn btn-sm btn-secondary" onclick="App.reloadLogs()">' + icon('refresh') + t('refresh') + '</button></div></div>';
    if (!r.success) { $('tab-runlog').innerHTML = html + errBox(r.error) + '</div>'; return; }
    var types = {}; r.logs.forEach(function (l) { types[l.autoFixType] = true; });
    html += '<div class="toolbar"><input class="grow" id="logQ" placeholder="' + t('search') + '" value="' + h(F.q) + '" oninput="App.setLogFilter(\'q\', this.value)" style="max-width:360px">' +
      '<select style="width:auto" onchange="App.setLogFilter(\'status\', this.value)">' + [['all', t('all')], ['ok', 'OK'], ['fail', 'Fehler'], ['replay', 'Replay']].map(function (o) { return '<option value="' + o[0] + '"' + (F.status === o[0] ? ' selected' : '') + '>' + t('status') + ': ' + o[1] + '</option>'; }).join('') + '</select>' +
      '<select style="width:auto" onchange="App.setLogFilter(\'type\', this.value)"><option value="all">' + t('type') + ': ' + t('all') + '</option>' + Object.keys(types).sort().map(function (x) { return '<option' + (F.type === x ? ' selected' : '') + '>' + h(x) + '</option>'; }).join('') + '</select>' +
      '<span class="muted" id="logCount"></span></div><div id="logTable">' + logTableHtml() + '</div></div>';
    $('tab-runlog').innerHTML = html;
    updateLogCount();
  }
  function filteredLogs() {
    var F = S.logFilter, q = F.q.toLowerCase();
    return S.logs.logs.map(function (l, i) { l._idx = i; return l; }).filter(function (l) {
      var isReplay = l.projectName === 'Replay';
      if (F.status === 'ok' && !l.success) return false;
      if (F.status === 'fail' && l.success) return false;
      if (F.status === 'replay' && !isReplay) return false;
      if (F.type !== 'all' && l.autoFixType !== F.type) return false;
      if (q && (l.projectName + ' ' + l.targetLang + ' ' + l.jobUid + ' ' + l.message).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }
  function logTableHtml() {
    var list = filteredLogs();
    if (!list.length) return empty('Keine passenden Einträge.', 'search_off');
    return '<div class="table-wrap"><table class="history-table"><thead><tr><th>' + t('date') + '</th><th>' + t('project') + '</th><th>' + t('type') + '</th><th>' + t('language') + '</th><th>' + t('status') + '</th><th>Segmente</th><th>' + t('changes') + '</th><th></th></tr></thead><tbody>' +
      list.map(function (l) {
        var i = l._idx, isReplay = l.projectName === 'Replay', n = (l.changes || []).length;
        var row = '<tr><td style="white-space:nowrap">' + h(fmtDate(l.timestamp)) + '</td><td><b>' + h(l.projectName) + '</b><div class="mono-sm">' + h(l.jobUid) + '</div></td><td>' + typeBadge(l.autoFixType) + '</td><td>' + badge('b-gray', l.targetLang) + '</td>' +
          '<td>' + (l.success ? badge('b-green', 'OK') : badge('b-red', 'Fehler')) + (isReplay ? ' ' + badge('b-yellow', 'Replay') : '') + '</td><td><b>' + l.segmentsChanged + '</b> / ' + l.segmentsTotal + '</td>' +
          '<td>' + (n ? '<button class="row-toggle" onclick="App.toggleDiff(' + i + ')">' + icon(S.openDiffs[i] ? 'expand_less' : 'expand_more') + n + ' ' + t('changes') + '</button>' : '<span class="muted">–</span>') + '</td>' +
          '<td style="white-space:nowrap">' + (n && !isReplay && can('operator') ? '<button class="btn btn-sm btn-secondary" onclick="App.openReplay(' + i + ')">' + icon('upload') + t('repush') + '</button>' : '') + '</td></tr>';
        if (l.message && !l.success) row += '<tr><td colspan="8"><div class="notice err" style="margin:0">' + icon('error') + h(l.message) + '</div></td></tr>';
        if (S.openDiffs[i] && n) {
          row += '<tr><td colspan="8"><div class="diff-grid"><div class="hd">Seg</div><div class="hd">Source</div><div class="hd">Original → Korrigiert</div>' +
            l.changes.map(function (c) {
              return '<div class="mono-sm">' + h(c.id) + '</div><div>' + h(c.source) + '</div><div>' + diffHtml(c.original, c.corrected) + (c.reason ? '<div class="muted" style="margin-top:4px">' + h(c.reason) + '</div>' : '') + '</div>';
            }).join('') + '</div></td></tr>';
        }
        return row;
      }).join('') + '</tbody></table></div>';
  }
  function updateLogCount() { var c = $('logCount'); if (c && S.logs && S.logs.success) c.textContent = filteredLogs().length + ' / ' + S.logs.logs.length; }
  function setLogFilter(k, v) { S.logFilter[k] = v; $('logTable').innerHTML = logTableHtml(); updateLogCount(); }
  function toggleDiff(i) { S.openDiffs[i] = !S.openDiffs[i]; $('logTable').innerHTML = logTableHtml(); }
  function reloadLogs() { S.logs = null; renderRunLog(true); }
  function openReplay(i) {
    var l = S.logs.logs[i];
    dialog('<h3>' + t('repush') + ' nach Phrase</h3>' +
      '<div class="notice info">' + icon('info') + '<div>Die gespeicherten Änderungen werden per <b>Source-Text-Abgleich</b> auf den Job angewendet – ohne neuen Gemini-Aufruf.</div></div>' +
      '<div class="notice warn">' + icon('warning') + '<div>Der Job muss im Schritt „PE Gemini“ den Status <b>NEW oder ACCEPTED</b> haben.</div></div>' +
      '<div class="form-grid"><div class="form-row"><label>Project UID</label><input id="rpProject" value="' + h(l.projectUid) + '"></div><div class="form-row"><label>Job UID</label><input id="rpJob" value="' + h(l.jobUid) + '"></div></div>' +
      '<div class="form-row"><label>Changes JSON</label><textarea id="rpChanges" class="mono" rows="8">' + h(JSON.stringify(l.changes, null, 2)) + '</textarea></div><div id="rpResult"></div>' +
      '<div class="btn-row" style="justify-content:flex-end"><button class="btn btn-secondary" onclick="App.closeDialog()">' + t('cancel') + '</button><button class="btn btn-primary" id="rpGo">' + icon('upload') + t('repush') + '</button></div>');
    $('rpGo').onclick = function () {
      $('rpGo').disabled = true; $('rpResult').innerHTML = '<span class="spin-sm"></span>';
      call('apiHubReplay', $('rpProject').value.trim(), $('rpJob').value.trim(), $('rpChanges').value.trim()).then(function (r) {

        $('rpResult').innerHTML = '<div class="notice ok">' + icon('check_circle') + '<div><b>Re-Push erfolgreich.</b> Gematcht: ' + r.matched + ' / ' + r.totalChanges + ' · nicht gefunden: ' + r.notMatched + ' · Patches: ' + r.patchCount + '</div></div>';
        toast('Re-Push abgeschlossen: ' + r.matched + ' Segmente.'); S.logs = null;
      });
    };
  }

  // ------------------------------------------------------------------
  // ANALYSEN
  // ------------------------------------------------------------------
  var SUBS = [
    { key: 'mqm', icon: 'analytics', fields: ['dateFrom', 'dateTo', 'projectName', 'autoFixType', 'targetLang'], days: 30, hint: 'Gemini ordnet jede Korrektur einer MQM-Kategorie und einem Schweregrad zu.' },
    { key: 'benchmark', icon: 'compare_arrows', fields: ['dateFrom', 'dateTo', 'autoFixType'], days: 90, hint: 'Fehlerquote je Zielsprache auf Basis der MQM-Klassifizierung.' },
    { key: 'drift', icon: 'trending_up', fields: ['dateFrom', 'dateTo', 'targetLang'], days: 90, hint: 'Begriffe, die AutoFix immer wieder gleich korrigiert – Kandidaten für Termbase oder Prompt.' },
    { key: 'glossary', icon: 'menu_book', fields: ['dateFrom', 'dateTo', 'targetLang'], days: 90, hint: 'Gemini schlägt neue Termbase-Einträge vor. Nur zur manuellen Übernahme in Phrase.' }
  ];
  function renderAnalysis() {
    var A = S.analysis;
    if (!A.options) {
      call('apiHubFilterOptions').then(function (r) { A.options = r.success ? r : { projectNames: [], autoFixTypes: [], targetLangs: [] }; renderIf('analysis'); });
    }
    var sub = SUBS.filter(function (x) { return x.key === A.sub; })[0];
    var f = A.filters[sub.key] || (A.filters[sub.key] = defaultFilters(sub.days));
    var o = A.options || { projectNames: [], autoFixTypes: [], targetLangs: [] };
    var sel = function (id, label, values, cur, allVal) {
      return '<div class="form-row"><label>' + label + '</label><select id="an-' + id + '"><option value="' + allVal + '">' + t('all') + '</option>' +
        values.map(function (v) { return '<option' + (v === cur ? ' selected' : '') + '>' + h(v) + '</option>'; }).join('') + '</select></div>';
    };
    var fields = {
      dateFrom: '<div class="form-row"><label>' + t('date_from') + '</label><input type="date" id="an-dateFrom" value="' + h(f.dateFrom) + '"></div>',
      dateTo: '<div class="form-row"><label>' + t('date_to') + '</label><input type="date" id="an-dateTo" value="' + h(f.dateTo) + '"></div>',
      projectName: sel('projectName', t('project'), o.projectNames, f.projectName, ''),
      autoFixType: sel('autoFixType', t('type'), o.autoFixTypes, f.autoFixType, 'all'),
      targetLang: sel('targetLang', t('language'), o.targetLangs, f.targetLang, 'all')
    };
    var html = '<div class="sub-nav">' + SUBS.map(function (x) { return '<button class="' + (x.key === A.sub ? 'active' : '') + '" onclick="App.setSub(\'' + x.key + '\')">' + icon(x.icon) + t(x.key) + '</button>'; }).join('') + '</div>' +
      '<div class="card yellow"><div class="section-title"><span>' + icon(sub.icon) + ' ' + t(sub.key) + '</span></div><p class="hint">' + h(sub.hint) + '</p>' +
      '<div class="filter-grid">' + sub.fields.map(function (k) { return fields[k]; }).join('') + '</div><div class="btn-row">' +
      (can('operator') ? '<button class="btn btn-primary" onclick="App.runAnalysis(false)"' + (A.busy ? ' disabled' : '') + '>' + (A.busy ? '<span class="spin-sm"></span>' : icon(sub.icon)) + t('generate') + '</button>' +
        (sub.key === 'mqm' ? '<button class="btn btn-black" onclick="App.runAnalysis(true)"' + (A.busy ? ' disabled' : '') + '>' + icon('table_chart') + t('export_sheet') + '</button>' : '')
        : '<span class="muted">Analysen rufen Gemini auf und brauchen die Rolle „Ausführen“.</span>') +
      '</div></div><div id="anResult">' + analysisResultHtml(sub.key) + '</div>';
    $('tab-analysis').innerHTML = html;
  }
  function defaultFilters(days) {
    var d = new Date(); d.setDate(d.getDate() - days);
    return { dateFrom: d.toISOString().split('T')[0], dateTo: new Date().toISOString().split('T')[0], projectName: '', autoFixType: 'all', targetLang: 'all' };
  }
  function setSub(k) { readFilters(); S.analysis.sub = k; renderAnalysis(); }
  function readFilters() {
    var A = S.analysis, f = A.filters[A.sub];
    if (!f) return;
    ['dateFrom', 'dateTo', 'projectName', 'autoFixType', 'targetLang'].forEach(function (k) { var el = $('an-' + k); if (el) f[k] = el.value; });
  }
  function runAnalysis(doExport) {
    readFilters();
    var A = S.analysis, key = A.sub, f = A.filters[key];
    A.busy = true; A.result[key] = { loading: true }; renderAnalysis();
    var p = key === 'mqm' ? call('apiHubMqm', f, !!doExport) : key === 'benchmark' ? call('apiHubBenchmark', f) : key === 'drift' ? call('apiHubDrift', f) : call('apiHubGlossary', f);
    p.then(function (r) { A.busy = false; A.result[key] = r; r._export = !!doExport; renderIf('analysis'); });
  }
  function sevCell(n, cls) { return n > 0 ? '<span class="' + cls + '">' + n + '</span>' : '<span class="muted">0</span>'; }
  function analysisResultHtml(key) {
    var r = S.analysis.result[key];
    if (!r) return '';
    if (r.loading) return '<div class="card">' + loader() + '<p class="hint" style="text-align:center">Gemini analysiert die Korrekturen …</p></div>';
    if (!r.success) return errBox(r.error);

        det.map(function (d) {

        }).join('') + '</tbody></table></div></div>';
      return html;
    }
    if (key === 'benchmark') {
      var pairs = r.pairs || [], maxRate = pairs.length ? pairs[0].errorRate || 1 : 1;
      return '<div class="card black"><div class="table-wrap"><table class="history-table"><thead><tr><th>' + t('language') + '</th><th>Fehlerquote</th><th>Fehler / Segmente / Jobs</th><th>Critical</th><th>Major</th><th>Minor</th><th>Häufigste Kategorie</th><th></th></tr></thead><tbody>' +
        pairs.map(function (p) {

          return '<tr><td>' + badge('b-gray', p.targetLang) + '</td><td><span class="' + cls + '" style="font-size:16px">' + p.errorRate + ' %</span></td><td>' + p.totalErrors + ' / ' + p.totalSegs + ' / ' + p.totalJobs + '</td><td>' + sevCell(p.critical, 'sev-critical') + '</td><td>' + sevCell(p.major, 'sev-major') + '</td><td>' + sevCell(p.minor, 'sev-minor') + '</td><td>' + badge('b-blue', p.topCategory) + ' <span class="muted">×' + p.topCategoryCount + '</span></td><td><span class="bar" style="width:' + Math.round(p.errorRate / maxRate * 110) + 'px"></span></td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    if (key === 'drift') {
      var terms = r.terms || [];
      if (!terms.length) return '<div class="card">' + empty('Kein signifikanter Terminologie-Drift gefunden.', 'check_circle') + '</div>';
      return '<div class="card black"><p class="hint">' + terms.length + ' Begriffe mit wiederholten Korrekturen (aus ' + r.totalLogs + ' Logs). Kandidaten für die Termbase oder die Nomenklatur im Prompt Hub.</p><div class="table-wrap"><table class="history-table"><thead><tr><th>Source-Begriff</th><th>' + t('language') + '</th><th>MT (häufigste Form) → Empfehlung</th><th>Korrekturen</th><th>' + t('projects') + '</th><th>Zuletzt</th></tr></thead><tbody>' +
        terms.map(function (x) {
          var cls = x.driftScore >= 10 ? 'sev-critical' : x.driftScore >= 5 ? 'sev-major' : 'sev-minor';
          return '<tr><td class="mono">' + h(x.sourceTerm) + '</td><td>' + badge('b-gray', x.targetLang) + '</td><td>' + diffHtml(x.topOriginal, x.topCorrected) + '</td><td><span class="' + cls + '">' + x.driftScore + '×</span></td><td title="' + h((x.projects || []).join(', ')) + '">' + x.projectCount + '</td><td>' + h(fmtDate(x.lastSeen, true)) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    var sug = r.suggestions || [];
    if (!sug.length) return '<div class="card">' + empty(r.message || 'Keine Vorschläge gefunden.', 'menu_book') + '</div>';
    return '<div class="card black"><p class="hint">' + sug.length + ' Vorschläge für neue Termbase-Einträge. <b>Nur zur manuellen Übernahme in Phrase.</b></p><div class="table-wrap"><table class="history-table"><thead><tr><th>Source</th><th>' + t('language') + '</th><th>Empfohlener Begriff</th><th>Konfidenz</th><th>Begründung</th></tr></thead><tbody>' +
      sug.map(function (s) {
        var cls = s.confidence >= 80 ? 'b-green' : s.confidence >= 60 ? 'b-yellow' : 'b-gray';
        return '<tr><td class="mono"><b>' + h(s.sourceDe) + '</b></td><td>' + badge('b-gray', s.targetLang) + '</td><td class="mono"><b>' + h(s.targetTerm) + '</b></td><td>' + badge(cls, s.confidence + ' %') + '</td><td>' + h(s.rationale) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function adminAudit(A) {
    return '<div class="card black wide"><div class="section-title"><span>' + icon('history') + ' Audit-Log</span></div><div class="table-wrap" style="max-height:420px;overflow:auto"><table class="history-table"><thead><tr><th>Zeit</th><th>Aktion</th><th>Details</th></tr></thead><tbody>' +
      A.audit.map(function (a) { return '<tr><td style="white-space:nowrap">' + h(fmtDate(a.timestamp)) + '</td><td>' + h(a.action) + '</td><td>' + h(a.details) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  }

  // ------------------------------------------------------------------
  // KEIN ZUGRIFF / HILFE
  // ------------------------------------------------------------------
  function renderDenied() {
    var b = S.boot;
    $('tab-denied').classList.add('active');
    $('tab-denied').innerHTML = '<div class="denied"><span class="material-icons-outlined big">block</span><h1 style="text-transform:uppercase">' + t('denied_title') + '</h1><p style="font-size:16px;line-height:1.6;color:var(--text-sub)">' + t('denied_text') + '</p></div>' +
      '<div class="admin-grid"><div class="card yellow"><div class="section-title"><span>' + icon('key') + ' ' + t('request_access') + '</span></div>' +
      '<div class="form-row"><label>Rolle</label><select id="rqRole"><option value="viewer">' + t('role_viewer') + ' – Dashboard, Run Log, Prompts</option><option value="operator">' + t('role_operator') + ' – zusätzlich Läufe, Poller, Re-Push, Analysen</option></select></div>' +
      '<div class="form-row"><label>' + t('reason') + ' <span style="color:var(--red)">*</span></label><textarea id="rqReason" rows="3"></textarea></div>' +
      '<button class="btn btn-primary" onclick="App.requestAccess()">' + icon('send') + t('send') + '</button></div>' +
      '<div class="card black"><div class="section-title"><span>' + t('my_requests') + '</span></div>' +
      ((b.myRequests || []).length ? '<table class="history-table"><tbody>' + b.myRequests.map(function (r) {
        return '<tr><td>' + h(fmtDate(r.createdAt)) + '</td><td>' + t('role_' + r.role) + '</td><td>' + badge(r.status === 'approved' ? 'b-green' : r.status === 'rejected' ? 'b-red' : 'b-yellow', t(r.status)) + '</td><td>' + h(r.comment || '') + '</td></tr>';
      }).join('') + '</tbody></table>' : empty('Noch keine Anträge.')) + '</div></div>';
  }
  function requestAccess() {
    call('apiHubRequestAccess', $('rqRole').value, $('rqReason').value).then(function (r) {
      if (!r.success) return toast(r.error, true);
      toast('Antrag gesendet. Du bekommst eine E-Mail, sobald er entschieden ist.');
      S.boot.myRequests = r.myRequests; renderDenied();
    });
  }
  function renderHelp() {
    var faq = [
      ['Was macht AutoFix?', 'AutoFix sucht in Phrase Projekte mit gesetztem AutoFix-Custom-Field und Jobs im Workflow-Schritt „PE Gemini“. Gemini post-editiert die maschinelle Übersetzung mit dem Prompt des jeweiligen Dokumenttyps. Die Korrekturen landen direkt im Job, jede Änderung steht im Run Log.'],
      ['Wo ändere ich die Prompts?', 'Im Prompt Hub. Dort sind die Prompts strukturiert, werden vor dem Veröffentlichen geprüft, lassen sich live testen und sind versioniert. Der Reiter „Prompts“ hier zeigt, was AutoFix gerade verwendet.'],
      ['Was ist der Unterschied zwischen Poller und „AutoFix jetzt starten“?', 'Der Poller läuft im Hintergrund alle 5, 10 oder 30 Minuten. „Jetzt starten“ löst sofort einen Lauf aus und zeigt den Fortschritt im Live-Run. Beide nutzen dieselbe Logik und dieselbe Run-Sperre, es läuft nie mehr als ein Lauf gleichzeitig.'],
      ['Was bedeutet Re-Push?', 'Die gespeicherten Änderungen eines Laufs werden erneut in einen Job geschrieben, zum Beispiel nach einem erneuten Import. Der Abgleich läuft über den Source-Text, Gemini wird nicht erneut aufgerufen.'],
      ['Welche Rolle brauche ich?', '„Ansehen“: Dashboard, Warteschlange, Run Log, Prompts. „Ausführen“: zusätzlich Läufe, Poller, Re-Push und Analysen (die Gemini aufrufen). „Admin“: Einstellungen, Nutzer, Freigaben, Wartung.'],
      ['Warum sind TM Threshold und Poller-Intervall „ohne Wirkung“?', 'Der aktuelle AutoFix-Code liest diese beiden Werte nicht. Den Poller-Takt bestimmst du beim Starten; TM-Treffer werden derzeit nicht an Gemini übergeben.']
    ];
    $('tab-help').innerHTML = '<div class="card black"><div class="section-title"><span>' + icon('help_outline') + ' ' + t('tab_help') + '</span></div>' +
      faq.map(function (f) { return '<details class="faq-item"><summary>' + f[0] + '</summary><div class="faq-answer">' + f[1] + '</div></details>'; }).join('') + '</div>';
  }

  document.addEventListener('DOMContentLoaded', init);

  return {
    setLang: setLang, toggleTheme: toggleTheme, showTab: showTab, closeDialog: closeDialog,
    pollerStart: pollerStart, pollerStop: pollerStop, testConnection: testConnection, openSheet: openSheet,
    runManual: runManual, lrClear: lrClear, reloadQueue: reloadQueue,
    reloadLogs: reloadLogs, setLogFilter: setLogFilter, toggleDiff: toggleDiff, openReplay: openReplay,
    setSub: setSub, runAnalysis: runAnalysis,
    decide: decide, saveUser: saveUser, addUser: addUser, removeUser: removeUser, setAdmin: setAdmin,
    saveSettings: saveSettings, saveConfig: saveConfig, forceUnlock: forceUnlock, clearCache: clearCache, exportToPromptHub: exportToPromptHub, debugProjects: debugProjects,
    requestAccess: requestAccess, _state: S
  };
})();

  </script>
