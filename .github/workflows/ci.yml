name: CI

# Jede Aenderung (Pull Request, Aufruf aus dem Deploy-Workflow) durchlaeuft:
#   1. Lint + Index.html aus ui/ aktuell
#   2. Logik-Tests (Node 20 + 22): Rollen, Schutz der AutoFix-Funktionen, Settings, Antraege
#   3. Browser-Tests der echten Oberflaeche (Chromium)
#   4. Mockups als Artefakt
#   5. Sicherheit: Secret-Scan (gitleaks) und npm audit

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Lint & generierte Dateien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run check

  unit:
    name: Logik-Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  ui:
    name: Oberflaeche (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Vorschau bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: preview/
          retention-days: 7

  mockups:
    name: Mockups
    needs: [ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run mockups
      - uses: actions/upload-artifact@v4
        with:
          name: mockups
          path: docs/mockups/
          retention-days: 14

  security:
    name: Sicherheit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks liest bei PRs die Commit-Liste des PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret-Scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm audit --audit-level=high
