name: CD

# Zwei Stufen, beide ueber clasp in eigene Apps-Script-Projekte:
#   Staging    - jeder gruene Stand auf main
#   Produktion - nur Release-Tags (v1.2.3) und nur nach Freigabe in der
#                GitHub-Umgebung "production" (Settings -> Environments ->
#                production -> Required reviewers)
# Vor jedem Deploy laeuft die komplette CI (workflow_call).
# Laeuft nur, wenn die Secrets gesetzt sind (sonst Hinweis, kein Fehler):
#   CLASPRC_JSON                      ~/.clasprc.json des Deploy-Kontos
#   STAGING_SCRIPT_ID, STAGING_DEPLOYMENT_ID
#   PROD_SCRIPT_ID,    PROD_DEPLOYMENT_ID

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: Ziel
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  staging:
    name: Deploy Staging
    needs: [ci]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clasp-deploy
        with:
          clasprc: ${{ secrets.CLASPRC_JSON }}
          script-id: ${{ secrets.STAGING_SCRIPT_ID }}
          deployment-id: ${{ secrets.STAGING_DEPLOYMENT_ID }}
          description: Staging ${{ github.sha }}

  production:
    name: Deploy Produktion
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Nur Tags auf main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main --depth=200
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag liegt nicht auf main."; exit 1; }
      - uses: ./.github/actions/clasp-deploy
        with:
          clasprc: ${{ secrets.CLASPRC_JSON }}
          script-id: ${{ secrets.PROD_SCRIPT_ID }}
          deployment-id: ${{ secrets.PROD_DEPLOYMENT_ID }}
          description: ${{ github.ref_name }}
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag || echo "::notice::Release existiert bereits."
